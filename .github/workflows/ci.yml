name: ci
on: [push, pull_request]
jobs:
  check:
    name: check (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # gen-17 CI hardening: Python 3.10 and 3.11 resolve to different science-stack
        # versions (numpy/scipy/scikit-learn), so each leg pins its own content-addressed lock.
        include:
          - python-version: "3.10"
            lock: tools/ci/requirements-ci-py310.lock
          - python-version: "3.11"
            lock: tools/ci/requirements-ci-py311.lock
    steps:
      # Actions are SHA-pinned to exact commits (content-addressed), not mutable tags, so a
      # retagged upstream action cannot silently change what runs. Comments name the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      # Content-addressed hash-locked install: every wheel is verified by sha256 and every
      # transitive dependency is pinned. A mutated, yanked, or substituted artifact is refused.
      # The full lock is regenerable with uv (see tools/ci/requirements-ci.in) for replay.
      - run: python -m pip install --require-hashes -r ${{ matrix.lock }}
      # Independent replay: re-derive the supply-chain manifest from repository bytes and refuse
      # any drift (a lock edit, or an action reverted to a mutable tag). Fail-closed.
      - run: python tools/ci/verify_supply_chain.py
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/validate_docs.py
