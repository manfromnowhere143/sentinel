name: ci
on: [push, pull_request]
jobs:
  check:
    name: check (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # ruff is pinned to the exact locally verified version: the generation-16 receipt lane
      # failed when a newer ruff shipped mid-ceremony and introduced new default findings.
      # The full content-addressed toolchain lock is the CI_HARDENING (generation-17) mission.
      - run: pip install ruff==0.15.20 pytest numpy scikit-learn
      - run: ruff check .
      - run: pytest -q
      - run: python scripts/validate_docs.py
