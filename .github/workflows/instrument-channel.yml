name: Publish Sentinel instrument evidence
on:
  push:
    branches: ['research/**']
permissions:
  contents: write
  actions: read
concurrency:
  group: sentinel-instrument-channel
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'manfromnowhere143/sentinel'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Wait for this exact source's scientific CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, time
          deadline = time.monotonic() + 2700
          while time.monotonic() < deadline:
              raw = subprocess.check_output(['gh', 'api', 'repos/manfromnowhere143/sentinel/actions/workflows/ci.yml/runs?event=push&per_page=20&head_sha=' + os.environ['SOURCE_SHA']])
              runs = json.loads(raw)['workflow_runs']
              runs = [r for r in runs if r['head_sha'] == os.environ['SOURCE_SHA']]
              if runs:
                  latest = max(runs, key=lambda r: (r['run_number'], r['run_attempt']))
                  if latest['status'] == 'completed':
                      if latest['conclusion'] != 'success':
                          raise SystemExit('Exact-source CI did not pass; channel unchanged.')
                      break
              time.sleep(30)
          else:
              raise SystemExit('CI observation deadline; channel unchanged.')
          PY
      - name: Export closed evidence and atomically advance channel
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/instrument_progress.py --output "$RUNNER_TEMP/sentinel-progress.json" --publish
